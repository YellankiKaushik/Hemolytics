version = 0.1

[default.global.parameters]
stack_name = "hemolytics-backend"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
stack_name = "hemolytics-backend"
s3_prefix = "hemolytics-backend"
parameter_overrides = "DatasetBucketName=\"\" DatasetKey=\"Dataset.csv\" BedrockModelId=\"anthropic.claude-3-haiku-20240307-v1:0\""

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
